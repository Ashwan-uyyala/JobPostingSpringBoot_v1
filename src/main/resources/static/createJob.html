
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Job | CareerHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="/">CareerHub</a>
        <a class="nav-link" href="jobs.html">View Jobs →</a>
    </header>

    <main class="page-container">
        <a class="back-link" href="/">← Back to Home</a>

        <section class="form-card">
            <p class="eyebrow">EMPLOYER WORKSPACE</p>
            <h1>Create a Job</h1>
            <p class="subtitle">Fill in the details to publish your opening.</p>

            <form id="jobForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="title">Job Title *</label>
                        <input id="title" name="title" required
                               placeholder="e.g. Java Developer">
                    </div>

                    <div class="field">
                        <label for="company">Company Name *</label>
                        <input id="company" name="company" required
                               placeholder="e.g. Acme Technologies">
                    </div>

                    <div class="field">
                        <label for="location">Location *</label>
                        <input id="location" name="location" required
                               placeholder="e.g. Chennai">
                    </div>

                    <div class="field">
                        <label for="jobType">Job Type *</label>
                        <select id="jobType" name="jobType" required>
                            <option value="">Select job type</option>
                            <option>Full-time</option>
                            <option>Part-time</option>
                            <option>Internship</option>
                            <option>Contract</option>
                            <option>Remote</option>
                        </select>
                    </div>

                    <div class="field full-width">
                        <label for="salary">Salary *</label>
                        <input id="salary" name="salary" required
                               placeholder="e.g. ₹6–10 LPA">
                    </div>

                    <div class="field full-width">
                        <label for="description">Job Description *</label>
                        <textarea id="description" name="description"
                                  rows="5" required
                                  placeholder="Describe the role and responsibilities..."></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="skills">Required Skills *</label>
                        <input id="skills" name="skills" required
                               placeholder="e.g. Java, Spring Boot, SQL">
                        <small>Separate skills with commas.</small>
                    </div>
                </div>

                <button class="button primary submit-button" type="submit">
                    Create Job Posting
                </button>
            </form>

            <p id="statusMessage" role="status" aria-live="polite"></p>
            <div id="createdJob"></div>
        </section>
    </main>
</body>
</html>
